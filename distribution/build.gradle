plugins {
    id 'com.gradleup.shadow'
}

repositories {
    mavenCentral()
    maven { url = uri('https://mvn.wesjd.net/') }
    maven { url = uri('https://repo.faststats.dev/releases') }
}

dependencies {
    implementation project(':core')
}

tasks.named('shadowJar', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveBaseName = 'ZonePracticePro'
    archiveClassifier = ''

    // ServiceLoader must find relocated MariaDB authentication plugins and JDBC drivers.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    mergeServiceFiles()

    exclude 'META-INF/maven/**', 'META-INF/proguard/**'
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    exclude '**/module-info.class', 'org/intellij/**', 'org/jetbrains/**', 'org/jspecify/**'
    exclude '**/.DS_Store'

    relocate 'net.megavex.scoreboardlibrary', 'dev.nandi0813.practice.dependencies.sidebar'
    relocate 'dev.dejvokep.boostedyaml', 'dev.nandi0813.practice.dependencies.boostedyaml'
    relocate 'net.wesjd.anvilgui', 'dev.nandi0813.practice.dependencies.anvilgui'
    relocate 'org.bstats', 'dev.nandi0813.practice.dependencies.bstats'
    relocate 'dev.faststats', 'dev.nandi0813.practice.dependencies.faststats'
    relocate 'com.google.gson', 'dev.nandi0813.practice.dependencies.gson'
    relocate 'com.zaxxer.hikari', 'dev.nandi0813.practice.dependencies.hikari'
    relocate 'org.mariadb.jdbc', 'dev.nandi0813.practice.dependencies.mariadb'
}
